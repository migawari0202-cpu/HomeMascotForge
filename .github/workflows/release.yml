name: Release

# v* タグを push したら、署名済みの release APK を作って GitHub Release に添付する。
#   例:  git tag v2.3 && git push origin v2.3
# 必要な Secret（RELEASE.md 参照）:
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release を作るために write 権限が必要。
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ci.yml と同じ理由で v3 は使えない（tools パッケージ廃止で即死）。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Secret に入れた keystore（base64）を一時ファイルへ復元し、
      # build.gradle.kts が読む KEYSTORE_PATH に流し込む。
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/HomeMascot-${{ github.ref_name }}.apk"

      # draft: true にしているので、まずドラフトとして作成される →
      # GitHub 上で内容を確認してから「Publish」すればOK。自動公開にしたい場合は false に。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: true
