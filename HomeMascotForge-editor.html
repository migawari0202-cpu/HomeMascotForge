      })),
      h('td', {}, h('input', { type: 'color', value: emotion.color, onchange: e => { emotion.color = e.target.value; changed(); renderPanel(); } })),
      h('td', {}, upload, emotion.image ? button('仮画像に戻す', () => { emotion.image = null; changed(); renderPanel(); }) : h('span', { class: 'muted', text: '未登録（仮画像を書き出します）' }))));
  const actions = [
    button('上へ', () => { if (index > 0) { list.splice(index - 1, 0, list.splice(index, 1)[0]); changed(); renderPanel(); } }),
    button('下へ', () => { if (index < list.length - 1) { list.splice(index + 1, 0, list.splice(index, 1)[0]); changed(); renderPanel(); } }),
    button('削除', () => {
      try { removeEmotion(project, emotion.id); changed('表情を削除しました。'); }
      catch (error) { say(error.message); }
      renderPanel();
    }),
  ];
  return card(emotion, 'emotion', title, actions, table);
}
// 本文の行数とセリフごとの設定をそろえる。
function syncMeta(owner) {
  const count = parseSpeeches(owner.text).length;
  const meta = Array.isArray(owner.meta) ? owner.meta.slice(0, count) : [];
  while (meta.length < count) meta.push({ emotion: 'normal', effect: null });
  owner.meta = meta.map(m => ({ emotion: 'normal', effect: null, ...m }));
  return owner.meta;
}

function insertTool(textarea, owner, redraw) {
  const variables = [...EXPANDABLE, ...project.states.filter(s => s.type !== 'raw').map(s => s.id)];
  const picker = select(variables.map(v => [v, `{${v}}`]), variables[0], () => {});
  return h('span', {}, '変数を差し込む ', picker, button('差し込む', () => {
    const token = `{${picker.value}}`;
    const start = textarea.selectionStart ?? textarea.value.length;
    const end = textarea.selectionEnd ?? start;
    textarea.value = textarea.value.slice(0, start) + token + textarea.value.slice(end);
    owner.text = textarea.value;
    changed(); redraw();
    textarea.focus();
    textarea.setSelectionRange(start + token.length, start + token.length);
  }));
}

// セリフごとの表情と「話したときの変化」。
function speechTable(owner) {
  const box = h('div', {});
  const draw = () => {
    box.replaceChildren();
    const groups = parseSpeeches(owner.text);
    const meta = syncMeta(owner);
    if (!groups.length) { box.append(h('p', { class: 'muted', text: '本文が空です。1件以上書いてください。' })); return; }
    const table = h('table', {}, h('tr', {}, ['#', 'セリフ', '表情', '変化する状態', '動作', '値', ''].map(text => h('th', { text }))));
    groups.forEach((group, index) => {
      const item = meta[index];
      const text = group.lines.join(' / ');
      const cells = [
        h('td', { class: 'num', text: String(index + 1) }),
        h('td', {}, item.verbatim ? h('span', { class: 'badge raw', text: '取り込み' }) : null, text.length > 40 ? `${text.slice(0, 40)}…` : text),
        h('td', {}, select(project.emotions.map(e => [e.id, e.label]), item.emotion, value => { item.emotion = value; changed(); })),
      ];
      if (item.verbatim) {
        cells.push(h('td', { colspan: 3 }, h('span', { class: 'muted', text: '取り込んだ記述はそのまま出力します。' })));
      } else if (item.effect?.raw) {
        cells.push(h('td', { colspan: 3 }, h('span', { class: 'badge raw', text: '取り込み' }), h('code', { text: item.effect.raw })));
      } else {
        const states = project.states.filter(s => s.type !== 'raw');
        const effect = item.effect ?? null;
        cells.push(h('td', {}, select([['', 'なし'], ...states.map(s => [s.id, s.label])], effect?.stateId ?? '', value => {
          if (!value) { item.effect = null; changed(); draw(); return; }
          const state = findState(states, value);
          const action = state.type === 'number' ? 'increment' : state.type === 'choice' ? 'set' : 'toggle';
          item.effect = { stateId: value, action };
          if (action !== 'toggle') item.effect.value = state.type === 'number' ? 1 : state.type === 'choice' ? (state.options ?? [])[0]?.value ?? '' : 'true';
          changed(); draw();
        })));
        const state = findState(states, effect?.stateId);
        if (!state) {
          cells.push(h('td', { class: 'muted', text: '—' }), h('td', { class: 'muted', text: '—' }));
        } else {
          const actions = state.type === 'number' ? [['increment', '増やす'], ['decrement', '減らす'], ['set', 'この値にする']]
            : state.type === 'choice' ? [['set', 'この値にする']] : [['set', 'この値にする'], ['toggle', '反転する']];
          cells.push(h('td', {}, select(actions, effect.action, value => {
            effect.action = value;
            if (value === 'toggle') delete effect.value;
            else if (state.type === 'choice') effect.value = (state.options ?? [])[0]?.value ?? '';
            else if (state.type === 'flag') effect.value = 'true';
            else effect.value = Number.isInteger(effect.value) ? effect.value : 1;
            changed(); draw();
          })));
          if (effect.action === 'toggle') cells.push(h('td', { class: 'muted', text: '—' }));
          else if (state.type === 'choice') cells.push(h('td', {}, select((state.options ?? []).map(o => [o.value, o.label]), effect.value, value => { effect.value = value; changed(); })));
          else if (state.type === 'flag') cells.push(h('td', {}, select([['true', 'はい'], ['false', 'いいえ']], effect.value, value => { effect.value = value; changed(); })));
          else cells.push(h('td', { class: 'num' }, numberInput(effect.value, value => { effect.value = value; changed(); })));
        }
      }
      cells.push(h('td', {}, item.verbatim ? button('通常のセリフに戻す', () => { delete item.verbatim; changed(); draw(); }, 'link') : null));
      table.append(h('tr', {}, cells));
    });
    box.append(table);
  };
  draw();
  return { box, draw };
}
function renameScene(scene, value) {
  if (value === scene.id) return;
  if (!ID_PATTERN.test(value) || value.length > LIMITS.idLength) { say('内部IDは英字か _ で始まる英数字と _ の30文字以内にしてください。'); renderPanel(); return; }
  if (value === 'default' || project.scenes.some(s => s !== scene && s.id === value)) { say(`内部ID「${value}」はすでに使われています。`); renderPanel(); return; }
  scene.id = value;
  changed('内部IDを変更し、ファイル名も変わりました。');
  renderPanel();
}

function sceneCard(owner, index, isFallback) {
  const countText = () => `セリフ${parseSpeeches(owner.text).length}件`;
  const nameText = label => (isFallback ? 'いつもの会話' : `場面${index + 1}：${label}`);
  const name = h('strong', { text: nameText(owner.label) });
  const counter = h('span', { class: 'muted', text: countText() });
  const title = isFallback
    ? [name, h('span', { class: 'muted', text: '条件なし・いちばん最後に使われます' }), counter]
    : [name, h('code', { text: owner.id }),
      h('span', { class: 'muted', text: `優先度 ${(project.scenes.length - index) * 10}（上にあるほど高い）` }),
      h('span', { class: 'muted', text: `条件 ${(owner.conditions ?? []).length + (owner.anyOf ?? []).length}件` }), counter];
  const body = h('div', {});
  const grid = h('div', { class: 'field' });
  grid.append(h('span', { text: '場面名' }), isFallback ? h('span', { text: owner.label }) : textInput(owner.label, value => { owner.label = value; name.textContent = nameText(value); changed(); }));
  if (!isFallback) {
    grid.append(h('span', { text: '内部ID' }), textInput(owner.id, value => renameScene(owner, value)),
      h('span'), h('span', { class: 'hint', text: `保存先：speeches/${owner.id}.txt` }));
  }
  body.append(grid);
  if (!isFallback) {
    body.append(conditionList(owner.conditions ?? (owner.conditions = []), '条件（すべて満たすとき）', 'アプリの情報から選びます。複数書くと「すべて満たす」ときだけ使われます。'));
    body.append(conditionList(owner.anyOf ?? (owner.anyOf = []), 'または（どれか1つ満たすとき）', 'ここは「どれか1つでも満たせば」使われます。空なら使いません。'));
  }
  body.append(h('h3', { text: '本文' }));
  body.append(h('p', { class: 'hint', text: '空行でセリフを区切ります（1つのセリフは何行でも書けます。改行はそのまま表示されます）。「#」で始まる行は読み飛ばされるため、検証で止めます。' }));
  const textarea = h('textarea', { rows: 12 });
  textarea.value = owner.text;
  const speech = speechTable(owner);
  textarea.addEventListener('input', () => { owner.text = textarea.value; counter.textContent = countText(); changed(); speech.draw(); });
  body.append(textarea);
  body.append(h('div', {}, insertTool(textarea, owner, () => { counter.textContent = countText(); speech.draw(); })));
  body.append(h('h3', { text: 'セリフごとの設定' }));
  body.append(speech.box);
  const actions = isFallback ? null : [
    button('上へ', () => { if (index > 0) { project.scenes.splice(index - 1, 0, project.scenes.splice(index, 1)[0]); changed(); renderPanel(); } }),
    button('下へ', () => { if (index < project.scenes.length - 1) { project.scenes.splice(index + 1, 0, project.scenes.splice(index, 1)[0]); changed(); renderPanel(); } }),
    button('複製', () => {
      if (project.scenes.length >= LIMITS.scenes) { say(`セリフ群は${LIMITS.scenes}場面までです。`); return; }
      const copy = structuredClone({ ...owner, id: nextSceneId(), label: `${owner.label}のコピー` });
      project.scenes.splice(index + 1, 0, copy);
      changed('場面を複製しました。条件と本文を書き換えてください。');
      renderPanel();
    }),
    button('削除', () => { project.scenes.splice(index, 1); changed('場面を削除しました。'); renderPanel(); }),
  ];
  return card(owner, 'scene', title, actions, body);
}

function nextSceneId() {
  let n = project.scenes.length + 1;
  while (project.scenes.some(s => s.id === `scene_${n}`)) n++;
  return `scene_${n}`;
}

function addScene() {
  if (project.scenes.length >= LIMITS.scenes) { say(`セリフ群は${LIMITS.scenes}場面までです。`); return; }
  const scene = newScene(nextSceneId(), 'あたらしい場面');
  const first = project.states.find(s => s.type !== 'raw');
  const row = { key: first ? `state:${first.id}` : 'timeSlot', op: 'eq', value: '' };
  resetConditionRow(row);
  scene.conditions.push(row);
  project.scenes.push(scene);
  changed('場面を追加しました。');
  renderPanel();
}

function renderScenes(panel) {
  panel.append(h('h2', { text: `セリフ群　${project.scenes.length} / ${LIMITS.scenes}` }));
  panel.append(h('p', { class: 'hint', text: '上にある場面ほど優先されます。条件が重なったときは、いちばん上にある場面のセリフが使われます。各場面は見出しをクリックすると閉じられます（閉じたまま「上へ」「下へ」で並べ替えられます）。' }));
  addFoldBar(panel, [...project.scenes, project.fallback]);
  project.scenes.forEach((scene, index) => panel.append(sceneCard(scene, index, false)));
  panel.append(h('div', {}, button('＋ 場面を足す', addScene)));
  panel.append(h('h2', { text: 'いつもの会話' }));
  panel.append(sceneCard(project.fallback, 0, true));
}

function renderEmotionRules(panel) {
  panel.append(h('h2', { text: '表情の自動切替' }));
  panel.append(h('p', { class: 'hint', text: '上から順に見て、最初に条件が合った表情を使います。セリフごとに表情を選んでいる場合は、そちらが優先されます。' }));
  panel.append(h('p', { class: 'hint', text: `どれも合わなかったときは「${project.emotions.find(e => e.id === project.emotionDefault)?.label ?? '通常'}」を使います（表情の画面で変更できます）。` }));
  addFoldBar(panel, project.emotionRules);
  project.emotionRules.forEach((rule, index) => panel.append(ruleCard(rule, index)));
  panel.append(h('div', {}, button('＋ 自動切替を足す', () => {
    if (project.emotionRules.length >= LIMITS.emotionRules) { say(`自動切替は${LIMITS.emotionRules}件までです。`); return; }
    const first = project.states.find(s => s.type !== 'raw');
    const row = { key: first ? `state:${first.id}` : 'isLowBattery', op: 'eq', value: '' };
    resetConditionRow(row);
    project.emotionRules.push({ conditions: [row], emotion: project.emotions[project.emotions.length - 1].id });
    changed(); renderPanel();
  })));
}

function ruleCard(rule, index) {
  const emotionLabel = () => project.emotions.find(e => e.id === rule.emotion)?.label ?? rule.emotion;
  const arrow = h('span', { class: 'muted', text: `→ ${emotionLabel()}` });
  const title = [h('strong', { text: `自動切替${index + 1}` }),
    h('span', { class: 'muted', text: rule.expression ? '取り込みの条件' : `条件 ${(rule.conditions ?? []).length}件` }), arrow];
  const body = [
    rule.expression
      ? h('span', {}, h('span', { class: 'badge raw', text: '取り込み' }), h('code', { text: rule.expression }))
      : conditionList(rule.conditions ?? (rule.conditions = []), '条件', ''),
    h('div', { class: 'field' }, h('span', { text: 'この表情にする' }),
      select(project.emotions.map(e => [e.id, e.label]), rule.emotion, value => { rule.emotion = value; arrow.textContent = `→ ${emotionLabel()}`; changed(); })),
  ];
  const actions = [
    button('上へ', () => { if (index > 0) { project.emotionRules.splice(index - 1, 0, project.emotionRules.splice(index, 1)[0]); changed(); renderPanel(); } }),
    button('削除', () => { project.emotionRules.splice(index, 1); changed(); renderPanel(); }),
  ];
  return card(rule, 'rule', title, actions, body);
}
async function replaceProject(next, message, notes = []) {
  project = next;
  importNotes = notes;
  dirty = false;
  section = 'character';
  resetHistory();
  say(message);
  renderPanel();
  renderOutput();
}

function busyTask(task) {
  return async event => {
    const nodes = [...document.querySelectorAll('button, input, select, textarea')];
    nodes.forEach(node => { node.disabled = true; });
    try { await task(event); }
    catch (error) { say(error.message); }
    finally { nodes.forEach(node => { node.disabled = false; }); }
  };
}

function reportErrors() {
  const errors = validate(project);
  if (!errors.length) return false;
  say(`直すところが ${errors.length} 件あります。右の「検証」を見てください。`);
  renderOutput();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  return true;
}

$('new').onclick = () => {
  if (dirty && !confirm('保存していない変更を捨てて、新規の定義にしますか？')) return;
  replaceProject(newProject(), '新規の定義を用意しました。');
};

$('save-project').onclick = busyTask(() => {
  if (reportErrors()) return;
  download(new TextEncoder().encode(serialize(project)), projectFileName(project.character.id), 'application/json');
  dirty = false;
  say(`${projectFileName(project.character.id)} の保存を開始しました。ダウンロード先を確認してください。`);
});

$('export').onclick = busyTask(async () => {
  if (reportErrors()) return;
  const bytes = await buildZip(project, say);
  download(bytes, zipFileName(project.character.id), 'application/zip');
  say(`${zipFileName(project.character.id)} の保存を開始しました。画像が未登録の表情には丸アイコンと名前のPNGを入れています。同じIDへの上書き導入はできません。`);
});

$('open-project').onchange = busyTask(async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    if (dirty && !confirm('保存していない変更を置き換えますか？')) return;
    await replaceProject(parseProject(await file.text()), '定義を読み込みました。');
  } finally { event.target.value = ''; }
});

$('open-zip').onchange = busyTask(async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    if (dirty && !confirm('保存していない変更を置き換えますか？')) return;
    const { project: next, notes, source } = await importZip(await readFile(file));
    await replaceProject(next, `${source} から取り込みました。取り込みのメモを右に表示しています。`, notes);
  } finally { event.target.value = ''; }
});

window.addEventListener('beforeunload', event => {
  if (!dirty) return;
  event.preventDefault();
  event.returnValue = '';
});

$('undo').onclick = () => stepHistory(-1);
$('redo').onclick = () => stepHistory(1);

// Ctrl+S 保存 / Ctrl+O 開く / Ctrl+E ZIP書き出し / Ctrl+Z 戻す / Ctrl+Y やり直す
window.addEventListener('keydown', event => {
  if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === 's') { event.preventDefault(); $('save-project').click(); }
  else if (key === 'o') { event.preventDefault(); $('open-project').click(); }
  else if (key === 'e') { event.preventDefault(); $('export').click(); }
  else if (key === 'z' && !event.shiftKey) { event.preventDefault(); stepHistory(-1); }
  else if (key === 'y' || (key === 'z' && event.shiftKey)) { event.preventDefault(); stepHistory(1); }
});

$('about').textContent = '書き出すZIPは character.json ／ speeches/*.txt ／ images/*.png だけを含みます。'
  + '上限：状態30・表情100・場面50・セリフ10,000件・1ファイル10 MiB・合計50 MiB。'
  + 'ショートカット：Ctrl+S 定義を保存 ／ Ctrl+O 定義を開く ／ Ctrl+E ZIPを書き出す ／ Ctrl+Z 元に戻す ／ Ctrl+Y やり直す。'
  + '実機（HomeMascot）での表示確認は行っていません。';

resetHistory();
renderPanel();
renderOutput();
document.documentElement.dataset.ready = 'true';
})();

</script>
</body>
</html>
